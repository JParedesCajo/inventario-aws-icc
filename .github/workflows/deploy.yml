name: Despliegue Terraform - Lab09 OIDC

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      accion:
        description: "Accion de Terraform a ejecutar (apply o destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Terraform Deploy (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 3. Instalar HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: 4. Inicializar Backend S3 (terraform init)
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lab09/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: 5. Validar sintaxis (terraform validate)
        run: terraform -chdir=terraform validate

      - name: 6. Generar Plan (terraform plan)
        if: ${{ github.event_name == 'push' || inputs.accion == 'apply' }}
        run: terraform -chdir=terraform plan -out=tfplan

      - name: 7. Aplicar Infraestructura (terraform apply)
        if: ${{ github.event_name == 'push' || inputs.accion == 'apply' }}
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: 8. Destruir Infraestructura (terraform destroy)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.accion == 'destroy' }}
        run: terraform -chdir=terraform destroy -auto-approve